name: traffic-system

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:19092,PLAINTEXT://kafka:29092"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "8"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - traffic-network
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic gps.raw --partitions 8 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic gps.traces --partitions 8 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic gps.matched --partitions 8 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic gps.dead-letter --partitions 8 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - traffic-network
    restart: "no"

  tile38:
    build:
      context: ./services/tile38
      dockerfile: Dockerfile
    image: traffic-tile38:dev
    ports:
      - "9851:9851"
    volumes:
      - tile38-data:/data
    networks:
      - traffic-network
    restart: unless-stopped

  graphhopper:
    build:
      context: ./services/graphhopper
      dockerfile: Dockerfile
    image: traffic-graphhopper:dev
    ports:
      - "8989:8989"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx5g"
    volumes:
      - ./data/osm:/data/osm:ro
      - ./services/graphhopper/config/config.yml:/app/config/config.yml:ro
      - graphhopper-cache-vietnam-20260722:/data/graph-cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - traffic-network
    restart: unless-stopped

  location-service:
    build:
      context: ./services/location-service
      dockerfile: Dockerfile
    image: traffic-location-service:dev
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      TILE38_ADDRESS: "tile38:9851"
      GRAPHHOPPER_URL: "http://graphhopper:8989"
      GRAPHHOPPER_PROFILE: "car"
      GRAPHHOPPER_TIMEOUT: "5s"
      GRAPHHOPPER_GPS_ACCURACY: "10"
      GRAPHHOPPER_WORKERS: "4"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "gps.raw"
      KAFKA_TRACE_TOPIC: "gps.traces"
      KAFKA_MATCHED_TOPIC: "gps.matched"
      KAFKA_DEAD_LETTER_TOPIC: "gps.dead-letter"
      KAFKA_TRACE_BUILDER_GROUP: "location-trace-builder-v1"
      KAFKA_MATCHER_GROUP: "location-map-matching-v2"
      KAFKA_COMMIT_INTERVAL: "1s"
      TRACE_POINTS: "5"
      TRACE_OVERLAP_POINTS: "2"
      TRACE_MAX_POINT_GAP: "20s"
      TRACE_MIN_DISPLACEMENT_METERS: "10"
      TRACE_MAX_IMPLIED_SPEED_MPS: "70"
      DRIVER_INACTIVITY_TIMEOUT: "2m"
      DRIVER_MAX_BUFFERED_POINTS: "20"
      MATCH_MAX_ATTEMPTS: "3"
      MATCH_QUEUE_SIZE: "64"
      GPS_EDGE_COLLECTIONS: "hanoi_graph_edges_vietnam_20260722,hochiminh_graph_edges_vietnam_20260722"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      tile38:
        condition: service_healthy
      graphhopper:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - traffic-network
    restart: unless-stopped

networks:
  traffic-network:
    driver: bridge

volumes:
  tile38-data:
  kafka-data:
  graphhopper-cache:
  graphhopper-cache-vietnam-20260722:
